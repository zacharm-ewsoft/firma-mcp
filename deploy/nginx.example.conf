# Example nginx site for running firma-mcp without Docker (python -m firma_mcp on
# 127.0.0.1:8600, e.g. under the systemd unit in this directory).
# Replace mcp.example.com and obtain a certificate first (for example with certbot).
#
# Put this line in the http {} context, e.g. /etc/nginx/conf.d/firma-mcp-ratelimit.conf:
#   limit_req_zone $binary_remote_addr zone=firma_mcp:1m rate=30r/m;

server {
    listen 80;
    server_name mcp.example.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name mcp.example.com;

    ssl_certificate     /etc/letsencrypt/live/mcp.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mcp.example.com/privkey.pem;

    client_max_body_size 1m;

    # /mcp is the MCP endpoint. The rest is the OAuth flow: /auth/callback (return from GitHub),
    # /authorize, /token, /register, /revoke, /consent and the /.well-known/ discovery documents.
    location ~ ^/(mcp|auth/|authorize|token|register|revoke|consent|\.well-known/) {
        limit_req zone=firma_mcp burst=20 nodelay;
        proxy_pass http://127.0.0.1:8600;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location / { return 404; }
}
