[project]
name = "firma-mcp"
version = "0.1.0"
description = "Read-only remote MCP server for a small Polish company: KSeF, Merit Aktiva, IMAP mail, Fakturownia (experimental)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastmcp==4.1.8",  # the version the live test ran on; see README
    "imap-tools>=1.15,<2",
    "merit-activa-api>=2.1,<3",
    "httpx>=0.28,<1",
    "cryptography>=45",
    "python-dotenv>=1.1",
    "pypdf>=5",
    "python-docx>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=9", "pytest-asyncio>=1.0", "responses>=0.25", "ruff>=0.8"]

[project.scripts]
firma-mcp = "firma_mcp.__main__:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
